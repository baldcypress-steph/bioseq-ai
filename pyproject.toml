[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioseq-ai"
version = "0.1.0"
description = "An open-weight AI agent that turns plain-language questions into verified DNA/RNA sequence analyses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["biopython>=1.81", "openai>=1.40"]

[project.optional-dependencies]
app = ["streamlit>=1.50", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
bioseq = "bioseq_ai.cli:main"

[tool.setuptools]
packages = ["bioseq_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
