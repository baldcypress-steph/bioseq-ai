# BioSeq AI on one server: three decoupled services.
#
#   model    Ollama serving an open-weight Qwen3 model (private network only)
#   app      BioSeq AI web app; reaches the model only through BIOSEQ_BASE_URL
#   gateway  Caddy: HTTPS, serves the app at /, and exposes the model API at /v1
#            to outside clients only with  Authorization: Bearer $MODEL_API_KEY
#
# Settings come from .env (copy deploy/env.example). Start with:  docker compose up -d

services:
  model:
    image: ollama/ollama:0.6.8
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"          # keep the model loaded between questions
      OLLAMA_NUM_PARALLEL: "1"          # one request at a time fits a small CPU server
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"     # room for tool schemas and results
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      retries: 10

  model-init:                           # downloads the model once, then exits
    image: ollama/ollama:0.6.8
    depends_on:
      model:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://model:11434"
    entrypoint: ["ollama", "pull", "${BIOSEQ_MODEL:-qwen3:1.7b}"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    environment:
      BIOSEQ_BASE_URL: "${BIOSEQ_BASE_URL:-http://model:11434/v1}"
      BIOSEQ_MODEL: "${BIOSEQ_MODEL:-qwen3:1.7b}"
      BIOSEQ_API_KEY: "${BIOSEQ_API_KEY:-ollama}"
      BIOSEQ_TIMEOUT: "${BIOSEQ_TIMEOUT:-300}"
      BIOSEQ_LOCK_ENDPOINT: "1"
    depends_on:
      - model

  gateway:
    image: caddy:2.8.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
      MODEL_API_KEY: "${MODEL_API_KEY:?Set MODEL_API_KEY in .env}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
      - model

volumes:
  ollama:
  caddy_data:
