[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E6FFFB"
textColor = "#16323A"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 16
baseFontWeight = 400
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#B8D8D5"
